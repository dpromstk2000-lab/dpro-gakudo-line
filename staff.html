<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e5b51"><meta name="robots" content="noindex,nofollow"><title>DPRO 学童保育｜スタッフ当日画面</title><link rel="stylesheet" href="styles.css"></head><body class="staff-page"><header class="hero compact"><div class="wrap brand"><span class="mark">D</span><div><strong>DPRO GAKUDO</strong><small>スタッフ当日運用</small></div></div><div class="wrap"><p class="eyebrow">TODAY OPERATIONS</p><h1>入室・お迎え・<br>退室を安全に。</h1></div></header><main class="wrap main"><div id="staffStatus" class="status" aria-live="polite"></div><section id="staffLogin" class="card"><h2>スタッフログイン</h2><p class="hint">施設コード・職員コード・管理コードを確認します。</p><div class="two"><div class="field"><label>施設コード</label><input id="staffFacilityCode" class="control" autocomplete="off"></div><div class="field"><label>職員コード</label><input id="staffCode" class="control" autocomplete="username"></div></div><div class="field"><label>管理コード</label><input id="staffAccessCode" class="control" type="password" inputmode="numeric" autocomplete="current-password"></div><div class="buttons"><button id="staffDemoLogin" class="btn primary" type="button">支援員 佐藤として体験</button><button id="staffLoginBtn" class="btn secondary" type="button">ログイン</button></div></section><section id="staffApp" class="hidden"><section class="card staff-profile"><div><span class="badge">スタッフ</span><h2 id="staffName"></h2><p id="staffFacilityName" class="muted"></p></div><div class="buttons"><button id="staffReload" class="mini" type="button">更新</button><button id="staffLogout" class="btn danger" type="button">ログアウト</button></div></section><section id="staffSummary" class="summary-grid"></section><section class="card"><div class="section-head"><div><h2>本日の児童</h2><p class="muted">アレルギー・お迎え方法を確認して操作してください。</p></div><select id="staffFilter" class="control compact-control"><option value="all">すべて</option><option value="planned">未入室</option><option value="arrived">入室済み</option><option value="pickup_waiting">お迎え待ち</option><option value="departed">退室済み</option><option value="alert">警告あり</option><option value="absent">欠席</option></select></div><div id="staffChildren" class="staff-child-list"></div></section><section class="card"><div class="section-head"><h2>申し送り</h2><button id="openHandoffForm" class="mini" type="button">新規登録</button></div><div id="staffHandoffs"></div><form id="handoffForm" class="hidden subform"><div class="two"><div class="field"><label>児童</label><select id="handoffChild" class="control"><option value="">施設全体</option></select></div><div class="field"><label>分類</label><select id="handoffCategory" class="control"><option value="general">一般</option><option value="pickup">お迎え</option><option value="health">体調</option><option value="allergy">アレルギー</option><option value="behavior">様子</option><option value="school">学校</option><option value="family">家族</option><option value="safety">安全</option><option value="other">その他</option></select></div></div><div class="two"><div class="field"><label>優先度</label><select id="handoffPriority" class="control"><option value="normal">通常</option><option value="high">重要</option><option value="urgent">緊急</option><option value="low">低</option></select></div><div class="field"><label>公開範囲</label><select id="handoffVisibility" class="control"><option value="staff_only">スタッフのみ</option><option value="guardian_shareable">保護者共有可</option><option value="manager_only">管理者のみ</option></select></div></div><div class="field"><label>内容</label><textarea id="handoffContent" class="control" maxlength="3000" required></textarea></div><button class="btn primary" type="submit">申し送りを登録</button></form></section><section class="card"><div class="section-head"><h2>事故・ヒヤリハット速報</h2><button id="openIncidentForm" class="mini" type="button">入力する</button></div><form id="incidentForm" class="hidden subform"><div class="two"><div class="field"><label>児童</label><select id="incidentChild" class="control"><option value="">施設全体</option></select></div><div class="field"><label>種別</label><select id="incidentType" class="control"><option value="near_miss">ヒヤリハット</option><option value="injury">けが</option><option value="illness">体調不良</option><option value="missing_child">所在確認</option><option value="pickup_mismatch">お迎え相違</option><option value="allergy">アレルギー</option><option value="conflict">児童間トラブル</option><option value="property_damage">物損</option><option value="other">その他</option></select></div></div><div class="two"><div class="field"><label>重要度</label><select id="incidentSeverity" class="control"><option value="low">低</option><option value="medium">中</option><option value="high">高</option><option value="critical">重大</option></select></div><div class="field"><label>発生場所</label><input id="incidentLocation" class="control" maxlength="300"></div></div><div class="field"><label>概要</label><textarea id="incidentSummary" class="control" maxlength="3000" required></textarea></div><div class="field"><label>初動対応</label><textarea id="incidentAction" class="control" maxlength="3000" required></textarea></div><button class="btn danger" type="submit">速報を登録</button></form></section></section></main><dialog id="childDialog" class="staff-dialog"><form method="dialog"><button class="dialog-close" aria-label="閉じる">×</button></form><div id="childDialogBody"></div></dialog><footer class="footer"><span id="staffVersion"></span></footer><script src="config.js"></script><script src="common.js"></script><script src="staff.js"></script><script>
/* GAKUDO-DEMO-PREVIEW-AUTOLOGIN-20260802 */
(() => {
  const params = new URLSearchParams(window.location.search);
  if (params.get("demo") !== "1") return;

  const launch = () => {
    const login = document.getElementById("staffLogin");
    const button = document.getElementById("staffDemoLogin");
    if (!login || !button || login.classList.contains("hidden")) return;
    button.click();
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(launch, 350), { once: true });
  } else {
    setTimeout(launch, 350);
  }
})();
</script></body></html>
