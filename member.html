<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#0e5b51" name="theme-color"/><meta content="noindex,nofollow" name="robots"/><title>DPRO 学童保育｜保護者ポータル</title><link href="styles.css" rel="stylesheet"/><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head><body><header class="hero compact"><div class="wrap brand"><span class="mark">D</span><div><strong>DPRO GAKUDO</strong><small>保護者ポータル</small></div></div><div class="wrap"><p class="eyebrow">GUARDIAN PORTAL</p><h1>今日の予定と、<br/>お迎え連絡。</h1></div></header><main class="wrap main"><div aria-live="polite" class="status" id="status"></div><section class="card" id="login"><h2>ポータルを開く</h2><p class="hint">施設が承認したLINE連携と登録電話番号を、LINEアプリの本人確認で確認します。</p><div class="field"><label for="phone">登録電話番号</label><input class="control" id="phone" inputmode="tel" type="tel"/></div><div class="buttons"><button class="btn primary" id="demoLogin" type="button">山田様の保護者として体験</button><button class="btn secondary" id="loginBtn" type="button">ログイン</button></div></section><section class="hidden" id="portal"><div class="card profile"><div><span class="badge">保護者</span><h2 id="guardianName"></h2><p class="muted" id="facilityName"></p></div><button class="btn danger" id="logout" type="button">ログアウト</button></div><section class="card"><div class="section-head"><h2>児童・利用予定</h2><button class="mini" id="reload" type="button">更新</button></div><div id="children"></div></section><section class="card"><h2>欠席・利用変更</h2><form id="changeForm"><div class="two"><div class="field"><label>児童</label><select class="control" id="changeChild"></select></div><div class="field"><label>対象日</label><input class="control" id="changeDate" required="" type="date"/></div></div><div class="field"><label>申請内容</label><select class="control" id="changeType"><option value="absence">欠席</option><option value="add_day">利用日を追加</option><option value="change_arrival">入室時刻を変更</option><option value="change_departure">退室時刻を変更</option><option value="change_method">退室方法を変更</option></select></div><div class="two"><div class="field"><label>入室時刻</label><input class="control" id="arrivalTime" step="1800" type="time"/></div><div class="field"><label>退室時刻</label><input class="control" id="departureTime" step="1800" type="time"/></div></div><div class="field"><label>退室方法</label><select class="control" id="departureMethod"><option value="">変更なし</option><option value="guardian_pickup">保護者お迎え</option><option value="authorized_pickup">代理お迎え</option><option value="solo_return">一人帰り</option><option value="facility_shuttle">施設送迎</option><option value="other">その他</option></select></div><div class="field"><label>理由・連絡事項</label><textarea class="control" id="changeReason" maxlength="1000"></textarea></div><button class="btn primary" type="submit">申請を送信</button></form></section><section class="card"><h2>お迎え変更</h2><form id="pickupForm"><div class="two"><div class="field"><label>児童</label><select class="control" id="pickupChild"></select></div><div class="field"><label>対象日</label><input class="control" id="pickupDate" required="" type="date"/></div></div><div class="two"><div class="field"><label>退室時刻</label><input class="control" id="pickupTime" required="" step="1800" type="time"/></div><div class="field"><label>お迎え方法</label><select class="control" id="pickupMethod"><option value="guardian_pickup">保護者お迎え</option><option value="authorized_pickup">登録済み代理お迎え</option><option value="solo_return">一人帰り</option><option value="facility_shuttle">施設送迎</option><option value="other">その他</option></select></div></div><div class="field hidden" id="pickupPersonField"><label>代理お迎え者</label><select class="control" id="pickupPerson"></select></div><div class="field"><label>理由・確認事項</label><textarea class="control" id="pickupReason" maxlength="1000"></textarea></div><button class="btn primary" type="submit">お迎え変更を申請</button></form></section><section class="card"><h2>一人帰り許可申請</h2><form id="soloForm"><div class="field"><label>児童</label><select class="control" id="soloChild"></select></div><div class="two"><div class="field"><label>開始日</label><input class="control" id="soloFrom" required="" type="date"/></div><div class="field"><label>終了日</label><input class="control" id="soloTo" required="" type="date"/></div></div><div class="field"><label>許可曜日</label><div class="checks" id="weekdays"><label><input checked="" type="checkbox" value="1"/>月</label><label><input checked="" type="checkbox" value="2"/>火</label><label><input checked="" type="checkbox" value="3"/>水</label><label><input checked="" type="checkbox" value="4"/>木</label><label><input checked="" type="checkbox" value="5"/>金</label></div></div><div class="field"><label>帰宅開始時刻</label><input class="control" id="soloTime" required="" step="1800" type="time"/></div><div class="field"><label>帰宅経路</label><textarea class="control" id="routeNote" maxlength="1000"></textarea></div><div class="field"><label>緊急時の対応</label><textarea class="control" id="emergencyInstruction" maxlength="1000"></textarea></div><button class="btn primary" type="submit">許可申請を送信</button></form></section><section class="card holiday-card"><div class="section-head"><div><h2>長期休暇利用申請</h2><p class="muted">夏休みなどの利用希望日をまとめて申請します。</p></div><button class="mini" id="holidayReload" type="button">更新</button></div><div id="holidayPeriods"></div><form id="holidayForm"><div class="two"><div class="field"><label>児童</label><select class="control" id="holidayChild"></select></div><div class="field"><label>対象期間</label><select class="control" id="holidayPeriod"></select></div></div><div class="field"><label>利用希望日</label><div class="holiday-date-grid" id="holidayDates"></div></div><div class="two"><div class="field"><label>登所予定</label><input class="control" id="holidayArrival" step="1800" type="time" value="08:00"/></div><div class="field"><label>退所予定</label><input class="control" id="holidayDeparture" step="1800" type="time" value="18:00"/></div></div><div class="field"><label>退室方法</label><select class="control" id="holidayMethod"><option value="guardian_pickup">保護者お迎え</option><option value="authorized_pickup">登録済み代理お迎え</option><option value="solo_return">一人帰り</option><option value="facility_shuttle">施設送迎</option><option value="other">その他</option></select></div><div class="field"><label>連絡事項</label><textarea class="control" id="holidayNote" maxlength="2000"></textarea></div><button class="btn primary" type="submit">長期休暇利用を申請</button></form><h3>申請状況</h3><div id="holidayApplications"></div></section><section class="card"><h2>施設からのお知らせ</h2><div id="announcements"></div></section><section class="card"><h2>申請履歴</h2><div id="history"></div></section><section class="card"><h2>施設へ連絡</h2><form id="messageForm"><div class="field"><label>児童</label><select class="control" id="messageChild"><option value="">施設全体への連絡</option></select></div><div class="field"><label>件名</label><input class="control" id="messageSubject" maxlength="120"/></div><div class="field"><label>連絡内容</label><textarea class="control" id="messageBody" maxlength="2000" required=""></textarea></div><button class="btn primary" type="submit">施設へ送信</button></form><div id="messages"></div></section></section></main><footer class="footer"><span id="version"></span></footer><script src="config.js"></script><script src="common.js"></script><script src="member.js"></script><script>
/* GAKUDO-DEMO-PREVIEW-AUTOLOGIN-20260802 */
(() => {
  const params = new URLSearchParams(window.location.search);
  if (params.get("demo") !== "1") return;

  const launch = () => {
    const login = document.getElementById("login");
    const button = document.getElementById("demoLogin");
    if (!login || !button || login.classList.contains("hidden")) return;
    button.click();
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(launch, 350), { once: true });
  } else {
    setTimeout(launch, 350);
  }
})();
</script></body></html>
