<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e5b51"><meta name="robots" content="noindex,nofollow"><title>DPRO 学童保育｜保護者ポータル</title><link rel="stylesheet" href="styles.css"><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script></head><body><header class="hero compact"><div class="wrap brand"><span class="mark">D</span><div><strong>DPRO GAKUDO</strong><small>保護者ポータル</small></div></div><div class="wrap"><p class="eyebrow">GUARDIAN PORTAL</p><h1>今日の予定と、<br>お迎え連絡。</h1></div></header><main class="wrap main"><div id="status" class="status" aria-live="polite"></div><section id="login" class="card"><h2>ポータルを開く</h2><p class="hint">施設が承認したLINE連携と登録電話番号を確認します。</p><div class="field"><label for="lineUserId">LINEユーザーID</label><input id="lineUserId" class="control" autocomplete="off"></div><div class="field"><label for="phone">登録電話番号</label><input id="phone" class="control" type="tel" inputmode="tel"></div><div class="buttons"><button id="demoLogin" class="btn primary" type="button">山田様の保護者として体験</button><button id="loginBtn" class="btn secondary" type="button">ログイン</button></div></section><section id="portal" class="hidden"><div class="card profile"><div><span class="badge">保護者</span><h2 id="guardianName"></h2><p id="facilityName" class="muted"></p></div><button id="logout" class="btn danger" type="button">ログアウト</button></div><section class="card"><div class="section-head"><h2>児童・利用予定</h2><button id="reload" class="mini" type="button">更新</button></div><div id="children"></div></section><section class="card"><h2>欠席・利用変更</h2><form id="changeForm"><div class="two"><div class="field"><label>児童</label><select id="changeChild" class="control"></select></div><div class="field"><label>対象日</label><input id="changeDate" class="control" type="date" required></div></div><div class="field"><label>申請内容</label><select id="changeType" class="control"><option value="absence">欠席</option><option value="add_day">利用日を追加</option><option value="change_arrival">入室時刻を変更</option><option value="change_departure">退室時刻を変更</option><option value="change_method">退室方法を変更</option></select></div><div class="two"><div class="field"><label>入室時刻</label><input id="arrivalTime" class="control" type="time" step="1800"></div><div class="field"><label>退室時刻</label><input id="departureTime" class="control" type="time" step="1800"></div></div><div class="field"><label>退室方法</label><select id="departureMethod" class="control"><option value="">変更なし</option><option value="guardian_pickup">保護者お迎え</option><option value="authorized_pickup">代理お迎え</option><option value="solo_return">一人帰り</option><option value="facility_shuttle">施設送迎</option><option value="other">その他</option></select></div><div class="field"><label>理由・連絡事項</label><textarea id="changeReason" class="control" maxlength="1000"></textarea></div><button class="btn primary" type="submit">申請を送信</button></form></section><section class="card"><h2>お迎え変更</h2><form id="pickupForm"><div class="two"><div class="field"><label>児童</label><select id="pickupChild" class="control"></select></div><div class="field"><label>対象日</label><input id="pickupDate" class="control" type="date" required></div></div><div class="two"><div class="field"><label>退室時刻</label><input id="pickupTime" class="control" type="time" step="1800" required></div><div class="field"><label>お迎え方法</label><select id="pickupMethod" class="control"><option value="guardian_pickup">保護者お迎え</option><option value="authorized_pickup">登録済み代理お迎え</option><option value="solo_return">一人帰り</option><option value="facility_shuttle">施設送迎</option><option value="other">その他</option></select></div></div><div id="pickupPersonField" class="field hidden"><label>代理お迎え者</label><select id="pickupPerson" class="control"></select></div><div class="field"><label>理由・確認事項</label><textarea id="pickupReason" class="control" maxlength="1000"></textarea></div><button class="btn primary" type="submit">お迎え変更を申請</button></form></section><section class="card"><h2>一人帰り許可申請</h2><form id="soloForm"><div class="field"><label>児童</label><select id="soloChild" class="control"></select></div><div class="two"><div class="field"><label>開始日</label><input id="soloFrom" class="control" type="date" required></div><div class="field"><label>終了日</label><input id="soloTo" class="control" type="date" required></div></div><div class="field"><label>許可曜日</label><div id="weekdays" class="checks"><label><input type="checkbox" value="1" checked>月</label><label><input type="checkbox" value="2" checked>火</label><label><input type="checkbox" value="3" checked>水</label><label><input type="checkbox" value="4" checked>木</label><label><input type="checkbox" value="5" checked>金</label></div></div><div class="field"><label>帰宅開始時刻</label><input id="soloTime" class="control" type="time" step="1800" required></div><div class="field"><label>帰宅経路</label><textarea id="routeNote" class="control" maxlength="1000"></textarea></div><div class="field"><label>緊急時の対応</label><textarea id="emergencyInstruction" class="control" maxlength="1000"></textarea></div><button class="btn primary" type="submit">許可申請を送信</button></form></section><section class="card"><h2>施設からのお知らせ</h2><div id="announcements"></div></section><section class="card"><h2>申請履歴</h2><div id="history"></div></section><section class="card"><h2>施設へ連絡</h2><form id="messageForm"><div class="field"><label>児童</label><select id="messageChild" class="control"><option value="">施設全体への連絡</option></select></div><div class="field"><label>件名</label><input id="messageSubject" class="control" maxlength="120"></div><div class="field"><label>連絡内容</label><textarea id="messageBody" class="control" maxlength="2000" required></textarea></div><button class="btn primary" type="submit">施設へ送信</button></form><div id="messages"></div></section></section></main><footer class="footer"><span id="version"></span></footer><script src="config.js"></script><script src="common.js"></script><script src="member.js"></script></body></html>
